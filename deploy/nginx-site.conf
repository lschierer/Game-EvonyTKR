upstream application {
  server 127.0.1.1:3000;
  keepalive 32;
  keepalive_requests 10000;
  keepalive_timeout 1h;
}

server {
  listen 80;
  server_name REPLACE_SERVER_NAMES;
  return 301 https://$host$request_uri;
}

# Rate limit zones
map $http_user_agent $limit_key {
  default                           $binary_remote_addr;
  ~*LinkChecker                     "";
  ~*Googlebot                       "";
  ~*bingbot                         "";
}

limit_req_zone $limit_key zone=anti_hammer:10m rate=100r/s;
limit_req_zone $limit_key zone=generals_heavy:10m rate=50r/s;
limit_req_zone $binary_remote_addr zone=security_scan:10m rate=1r/m;

geo $bypass_rate_limit {
  default 0;
}

map $http_user_agent $bypass_rate_limit {
  default 0;
  ~*LinkChecker 1;
  ~*Googlebot 1;
  ~*bingbot 1;
}

server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name REPLACE_SERVER_NAMES;

  ssl_certificate /etc/letsencrypt/live/REPLACE_HOSTNAME.REPLACE_DOMAIN/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/REPLACE_HOSTNAME.REPLACE_DOMAIN/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_ciphers HIGH:!aNULL:!MD5;
  ssl_session_timeout 15m;

  # Block OpenAI crawlers
  if ($http_referer ~* (openai\.com)) {
    return 444;
  }

  # Block common security scanning patterns
  location ~* /(\.env|\.git|wp-admin|phpMyAdmin|admin|\.php$|\.asp$) {
    limit_req zone=security_scan burst=1 nodelay;
    limit_req_status 444;
    return 404;
  }

  # Block suspicious query strings
  if ($args ~* (union.*select|concat.*\(|base64_|javascript:|<script)) {
    return 444;
  }

  # Serve static files directly
  location ~* ^/(css|js|images|assets|types)/ {
    root /opt/prefix/app/share/public;
    expires 1y;
    add_header Cache-Control "public, immutable";
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_vary on;
  }

  # Serve ads.txt directly
  location = /ads.txt {
    root /opt/prefix/app/share/public;
    expires 1d;
  }

  location /Generals {
    limit_req zone=generals_heavy burst=5 nodelay;
    limit_req_status 429;
    proxy_pass http://application;
    proxy_http_version 1.1;
    proxy_read_timeout 3600;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 300s;
    proxy_send_timeout 300s;
  }

  location / {
    limit_req zone=anti_hammer burst=10 nodelay;
    limit_req_status 429;
    proxy_pass http://application;
    proxy_http_version 1.1;
    proxy_read_timeout 3600;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 300s;
    proxy_send_timeout 300s;
  }
}
