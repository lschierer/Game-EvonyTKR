# PAGI WebServer Framework Configuration

# Stage: localDev, staging, production
stage: localDev

# Server configuration
server:
  host: 127.0.0.1
  port: 3000
  worker_threads: 4

modules:
  '^WebFramework::Module::AutoIndex': {}
  '^WebFramework::Module::Navigation': {}
  '^WebFramework::Module::SiteLogo':
    site_logo: share/public/images/TKRTipsLogo.svg
  Template:
    paths:
      - templates
      - templates/partials
      - ../PAGI-WebServer/templates
      - ../PAGI-WebServer/templates/partials
    conf:
      EVAL_PERL: 1

# Directory paths
css_dir: public/css
js_dir: public/js
images_dir: public/images
typescript_dir: src/ts
markdown_dir: share/pages
# relative to the public directory

# Pandoc modules to load
pandoc_modules: []

log_base: Game-EvonyTKR
site_url: dev.hp-fan.schierer.org
# Module-specific log levels
log_config:
  default: INFO
  'Game::EvonyTKR': DEBUG
  'WebFramework': DEBUG
