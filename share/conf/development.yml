# PAGI WebServer Framework Configuration

# Stage: localDev, staging, production
stage: localDev

# Server configuration
server:
  host: 127.0.1.1
  port: 3000
  worker_threads: 4

modules:
  '^WebFramework::Module::AutoIndex': {}
  '^WebFramework::Module::Navigation': {}
  '^WebFramework::Module::SiteLogo':
    site_logo: share/public/images/TKRTipsLogo.svg
  Template:
    paths:
      - templates
      - templates/partials
      - ../PAGI-WebServer/templates
      - ../PAGI-WebServer/templates/partials
    conf:
      EVAL_PERL: 1

# Directory paths
css_dir: public/css
js_dir: public/js
images_dir: public/images
typescript_dir: src/ts
markdown_dir: share/pages
# relative to the public directory

# Pandoc modules to load
pandoc_modules:
  - commonmark
  - alerts
  - attributes
  - autolink_bare_uris
  - footnotes
  - implicit_header_references
  - pipe_tables raw_html
  - rebase_relative_paths
  - smart
  - gfm_auto_identifiers

log_base: Game-EvonyTKR
site_url: https://dev.evonytkrtips.net
# Module-specific log levels
log_config:
  default: DEBUG
  'Game::EvonyTKR': INFO
  'WebFramework': DEBUG
  'Game::EvonyTKR::Controller::Books': WARN
  'Game::EvonyTKR::Controller::Generals': WARN
  'Game::EvonyTKR::Controller::Pairs': DEBUG
  'Game::EvonyTKR::Controller::Monsters': DEBUG
  'Game::EvonyTKR::Service': WARN
  'Game::EvonyTKR::Shared::Logger': WARN
  'Test::Package': 'TRACE'
  'Test': 'TRACE'
  'LinkChecker': DEBUG
