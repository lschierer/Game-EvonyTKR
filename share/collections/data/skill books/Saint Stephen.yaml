name: Saint Stephen
text: >-
  Increases mounted troops' attack and HP by 60% and increases mounted troops' defense by 45% when General is leading the army to attack.
buffs:
  - attribute: Attack
    targetedType: Mounted Troops
    value:
      number: 60
  - attribute: HP
    targetedType: Mounted Troops
    value:
      number: 60
  - attribute: Defense
    targetedType: Mounted Troops
    condition:
      - Attacking
      - leading the army
    value:
      number: 45
