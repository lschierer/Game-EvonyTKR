name: Empire Offensive
text: >-
  Increases ranged troops and siege machines' attack by 20% when General is leading the army to attack. Increases ranged troops' attack by another 15% when General brings any dragon.
buffs:
  - attribute: Attack
    targetedType: Ranged Troops
    value:
      number: 20
    conditions:
      - leading the army
      - Attacking
  - attribute: Attack
    targetedType: Siege Machines
    value:
      number: 20
    conditions:
      - leading the army
      - Attacking
  - attribute: Attack
    targetedType: Ranged Troops
    value:
      number: 15
    conditions:
      - brings a dragon
