name: Eagle of Conquest
text: >-
  Increases ground troops' attack, defense and HP by 5% and ground troops' training speed by 20% when General is the Barracks Officer.
buffs:
  - attribute: Attack
    targetedType: Ground Troops
    conditions:
      - When Appointed as Barracks Officer
    value:
      number: 5
  - attribute: Defense
    targetedType: Ground Troops
    conditions:
      - When Appointed as Barracks Officer
    value:
      number: 5
  - attribute: HP
    targetedType: Ground Troops
    conditions:
      - When Appointed as Barracks Officer
    value:
      number: 5
  - attribute: Training Speed
    targetedType: Ground Troops
    condition:
      - When Appointed as Barracks Officer
    value:
      number: 20
