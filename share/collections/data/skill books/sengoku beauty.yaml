    value:
      number: 15
      unit: percentage
    conditions:
      - In City
      - When The Main Defense General
  - attribute: HP
    targetedType: Ground Troops
    value:
      number: 30
      unit: percentage
    conditions:
      - In City
      - When The Main Defense General
