name: Alter Mars
text: >-
  Increases ground troops' attack and HP by 60% and ground troops and mounted troops' defense by 45% when General is leading the army.
buffs:
  - attribute: Attack
    targetedType: Ground Troops
    value:
      number: 60
    conditions:
      - leading the army
  - attribute: HP
    targetedType: Ground Troops
    value:
      number: 60
    conditions:
      - leading the army
  - attribute: Defense
    targetedType: Ground Troops
    value:
      number: 45
    conditions:
      - leading the army
  - attribute: Defense
    targetedType: Mounted Troops
    value:
      number: 45
    conditions:
      - leading the army
