name: Magnifico
text: >-
  Increases ground troops' attack and defense by 60% when General is leading the army to attack. Increases ground troops and mounted troops' HP by 45% when general brings any Dragon or Spiritual Beast to attack.
buffs:
  - attribute: Attack
    troop: Ground Troops
    value:
      number: 60
    conditions:
      - leading_the_army
      - Attacking
  - attribute: Defense
    troop: Ground Troops
    value:
      number: 60
    conditions:
      - leading_the_army
      - Attacking
  - attribute: HP
    troop: Ground Troops
    value:
      number: 45
    conditions:
      - brings a dragon
      - Attacking
      - brings a spiritual beast
  - attribute: HP
    troop: Mounted Troops
    value:
      number: 45
    conditions:
      - brings a dragon
      - Attacking
      - brings a spiritual beast
