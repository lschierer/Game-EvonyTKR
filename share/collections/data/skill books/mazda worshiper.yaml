name: Mazda Worshiper
text: >-
  Increases siege machines' attack and HP by 55% and ranged troops and siege machines' defense by 40% when General is leading the army.
buffs:
  - attribute: Attack
    targetedType: Siege Machines
    value:
      number: 55
    conditions:
      - leading the army
  - attribute: HP
    targetedType: Siege Machines
    value:
      number: 55
    conditions:
      - leading the army
  - attribute: defense
    targetedType: Ranged Troops
    value:
      number: 40
    conditions:
      - leading the army
  - attribute: Defense
    targetedType: Siege Machines
    value:
      number: 40
    conditions:
      - leading the army
