# Logrotate configuration for Game-EvonyTKR application logs
# Uses copytruncate to avoid issues with processes holding open file handles

/opt/mojo/var/log/Perl/dist/Game-EvonyTKR/*.log {
    daily
    rotate 14
    missingok
    notifempty
    copytruncate
    compress
    delaycompress
    dateext
    dateformat -%Y%m%d
    create 0644 mojo mojo
    sharedscripts
}

# System log file (if it exists in home directory)
/home/luke/var/log/Perl/dist/Game-EvonyTKR/*.log {
    daily
    rotate 7
    missingok
    notifempty
    copytruncate
    compress
    delaycompress
    dateext
    dateformat -%Y%m%d
    create 0644 luke luke
    sharedscripts
}
